aid: toqio
name: Toqio
description: >-
  Toqio is an embedded finance platform that lets corporates and financial
  institutions design, launch, and scale financial products — accounts,
  payments, cards, lending, and expense management — for their SME customers
  without building infrastructure. The platform pairs a no-code/low-code
  Design Studio with a REST API (OAuth 2.0 client credentials) covering
  accounts, transactions, beneficiaries, cards, fees, compliance/KYB, revenue
  collection, and notifications, plus an Integration Hub through which banks
  and BaaS providers plug their services into the Toqio marketplace.
url: https://raw.githubusercontent.com/api-evangelist/toqio/refs/heads/main/apis.yml
