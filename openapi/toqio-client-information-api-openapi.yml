openapi: 3.0.0
info:
  description: Endpoints to manage client accounts
  version: v1.0.0
  title: Accounts Account Client information API
  license:
    name: license
servers:
- url: https://api.sandbox.toq.io/wallet/api
  description: Simulation environment
- url: https://api.toq.io/wallet/api
  description: Production environment
tags:
- name: Client information
paths:
  /customers/{customerId}/clients:
    get:
      tags:
      - Client information
      summary: Get clients
      description: Allows to get the different clients of a customer
      operationId: getClientsUsingGET
      parameters:
      - name: clientType
        in: query
        required: false
        schema:
          type: string
          enum:
          - BUSINESS
          - CONSUMER
      - name: customerId
        in: path
        description: customerId
        required: true
        schema:
          type: string
      - name: customerId
        in: query
        required: false
        schema:
          type: string
      - name: kyxStatus
        in: query
        required: false
        schema:
          type: string
          enum:
          - AWAITING_RESPONSE
          - REFERRED
          - COMPLETE
          - PENDING_EXTERNAL_APPROVAL
          - ACCEPT
          - DECLINE
          - CLOSE
          - REFQUE
          - STADEC
          - STACLR
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: text
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cif:
                          type: string
                        clientType:
                          type: string
                          enum:
                          - BUSINESS
                          - CONSUMER
                        createdAt:
                          type: string
                          format: date-time
                        createdBy:
                          type: object
                          properties:
                            email:
                              type: string
                            firstName:
                              type: string
                            id:
                              type: string
                            lastName:
                              type: string
                          title: ShortUserDTO
                        customerName:
                          type: string
                        id:
                          type: string
                        kyxStatus:
                          type: string
                          enum:
                          - AWAITING_RESPONSE
                          - REFERRED
                          - COMPLETE
                          - PENDING_EXTERNAL_APPROVAL
                          - ACCEPT
                          - DECLINE
                          - CLOSE
                          - REFQUE
                          - STADEC
                          - STACLR
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - LEAD
                          - ONBOARDING
                          - ONBOARDED
                          - FROZEN
                          - REJECTED
                        paymentProvider:
                          type: string
                        legalPhoneNumber:
                          type: string
                        legalPhoneCountry:
                          type: string
                        legalIntnlPhoneNumber:
                          type: string
                        statementDescriptor:
                          type: string
                      title: CompanyListItemDTO
                  paging:
                    type: object
                    properties:
                      hasNextPage:
                        type: boolean
                      hasPreviousPage:
                        type: boolean
                      pageNumber:
                        type: integer
                        format: int32
                      pageSize:
                        type: integer
                        format: int32
                      sortingCriteria:
                        type: string
                      totalNumberOfPages:
                        type: integer
                        format: int32
                      totalNumberOfRecords:
                        type: integer
                        format: int64
                    title: PageAndSort
                title: CompanyPageDTO
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /customers/{customerId}/clients/{clientId}:
    get:
      tags:
      - Client information
      summary: Get client
      description: Allows to get the client information
      operationId: getClientUsingGET
      parameters:
      - name: clientId
        in: path
        description: clientId
        required: true
        schema:
          type: string
      - name: customerId
        in: path
        description: customerId
        required: true
        schema:
          type: string
      responses:
