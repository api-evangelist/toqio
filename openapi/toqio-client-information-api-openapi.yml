                                    type: string
                                  es:
                                    type: string
                                  it:
                                    type: string
                                title: TranslateLabel
                              maximumFee:
                                type: number
                                format: double
                              minimumFee:
                                type: number
                                format: double
                              product:
                                type: string
                              type:
                                type: string
                                enum:
