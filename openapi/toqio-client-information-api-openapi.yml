                                    type: string
                                  en:
                                    type: string
                                  es:
                                    type: string
                                  it:
                                    type: string
                                title: TranslateLabel
                              variableFee:
                                type: number
                                format: double
                            title: BillingProductsDTO
                    title: ViewClientBillingDTO
                  cif:
                    type: string
                  city:
                    type: string
                  clientType:
                    type: string
                    enum:
                    - BUSINESS
                    - CONSUMER
                  complianceHistory:
