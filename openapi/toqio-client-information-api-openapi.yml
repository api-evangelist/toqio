                                - NEW_PHYSICAL_CARD
                                - PHYSICAL_CARD_FEE
                                - VIRTUAL_CARD_FEE
                                - ACCOUNT_FEE
                                - SWIFT_INBOUND
                                - INTER_LEDGER_INBOUND
                                - INTER_LEDGER_OUTBOUND
                                - SEPA_INBOUND
                                - SEPA_OUTBOUND
                                - FASTER_PAYMENTS_OUTBOUND
