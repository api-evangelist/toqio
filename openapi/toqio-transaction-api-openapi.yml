        customerId:
          type: string
        fullName:
          type: string
        nameOrFullName:
          type: string
        fullAddress:
          type: string
        addressLine:
          type: string
    TranslateLabel:
      type: object
      properties:
        es:
          type: string
        en:
          type: string
        zh:
          type: string
    QuoteRequest:
      type: object
      properties:
        sourceCurrency:
          type: string
        beneficiaryCurrency:
          type: string
        fixedSide:
          type: string
          enum:
          - BENEFICIARY
          - SENDER
        amount:
          type: number
          format: double
    ToqioHttpOkVoidResponse:
      type: object
      properties:
        data:
          type: object
          writeOnly: true
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
    PaymentProviderDetails:
