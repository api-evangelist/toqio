          - idr
          - points
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        addressStreet:
          type: string
        addressPostalCode:
          type: string
        addressCity:
          type: string
        addressIsoCountry:
          type: string
        bankCountry:
          type: string
        id:
