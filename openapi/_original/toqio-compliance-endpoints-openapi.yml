          - UNDER_REVIEW
          - DECLINED
          - PENDING
          - VERIFYING
          - VERIFIED
          - REFERRED
          - ACCEPTED
          - NOT_STARTED
          - CLOSE
          - OVERRIDE_COMPLIANCE
          - ADDED_BY_ADMIN
        shareholdersStatus:
