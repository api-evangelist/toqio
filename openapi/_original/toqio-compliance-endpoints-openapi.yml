          - FULLY_REJECTED
          - FULLY_ACCEPTED
          - PARTIALLY_ACCEPTED
          - IN_PROGRESS
          - NOT_STARTED
  securitySchemes:
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.toq.io/iam/oauth/token
          scopes: {}
