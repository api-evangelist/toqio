          type: string
      title: UserInviteDTO
      description: When selecting overrideCompliance true OR overrideCompliance false
        and runKYC true for SME REGISTERED clients, you can provide some information
        if you have it in advance about the company you want to onboard. All the DIRECTORS
        of the company MUST be added and will be required to do a KYC validation process
        by sending a live photo of their personal documentation and a selfie or a
        video, depending on the legislationCountry selection (e.g., if legislationCountry
        is GB this will be a selfie, if legislationCountry ES it will be a video).
        These DIRECTORS, in addition to the main user created in the OnboardingUserDTO,
        will go through this process to be reviewed in our compliance partner (overrideCompliance
        false) OR just saved to collect the information provided (overrideCompliance
        true AND runKYC true).
