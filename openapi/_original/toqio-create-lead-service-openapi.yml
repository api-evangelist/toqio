      - role
      properties:
        role:
          type: string
          enum:
          - ROLE_DIRECTOR
          - ROLE_COMPANY_ADMIN
          - ROLE_EMPLOYEE
          - ROLE_ACCOUNTANT
          - ROLE_OWNER
          - ROLE_BENEFICIARY
          - ROLE_AGENT
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneCountry:
          type: string
          description: You MUST add the country prefix. We will send an OTP SMS message
            when the user is setting up the credentials.
        phoneNumber:
          type: string
          description: You MUST add a mobile phone. By adding a landline the request
            will be rejected.
        birthDate:
          type: string
