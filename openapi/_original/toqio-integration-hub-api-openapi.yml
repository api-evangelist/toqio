openapi: 3.0.1
info:
  title: Toqio Integration Hub API
  version: v0
servers:
- url: https://your_connector_url
  description: This is an example url that you could use for testing purposes as this
    documentation describes the API that you must develop in your connector.
paths:
  /customers/{customerId}/lending/loans/offers/{loanOfferId}/accept:
    put:
      tags:
      - Lending - Loan - Offer
      summary: Accept a loan offer
      description: ''
      operationId: acceptLoanOffer
      parameters:
      - name: customerId
        in: path
        description: Customer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      - name: loanOfferId
        in: path
        description: Loan offer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Loan offer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkLoanOfferResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /customers/{customerId}/directDebit:
    post:
      tags:
      - Direct debit
      summary: Apply Direct Debit
      description: ''
      operationId: applyDirectDebit
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitFilter'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkBooleanResponse'
        '400':
          description: INVALID_REQUEST
        '404':
          description: BANK_NOT_FOUND
  /customers/{customerId}/clients/{clientId}/accounts:
    post:
      tags:
      - Account
      summary: Create account
      description: ''
      operationId: createAccount
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLedgerBaseRequest'
        required: true
      responses:
        '200':
          description: Account successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkAccountBaseResponse'
        '400':
          description: BAD_REQUEST
        '403':
          description: INVALID_ACCOUNT_PRODUCT_CODE_COUNTRY
        '404':
          description: ERROR_CLIENT_NOT_FOUND
        '500':
          description: INVALID_CLIENT_CONFIGURATION
    get:
      tags:
      - Account
      summary: Get accounts
      description: ''
      operationId: getAccounts
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of account successfully retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToqioHttpOkAccountsBaseResponse'
        '400':
          description: BAD_REQUEST
        '404':
          description: BANK_NOT_FOUND
        '500':
          description: INVALID_CLIENT_CONFIGURATION
  /customers/{customerId}/clients/{clientId}/beneficiaries:
    post:
      tags:
      - Beneficiary
      summary: Create a new beneficiary
      description: ''
      operationId: createBeneficiary
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePersonalAccountRequest'
        required: true
      responses:
        '200':
          description: Beneficiary created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewPersonalAccountResponse'
        '404':
          description: ERROR_CLIENT_NOT_FOUND
    get:
      tags:
      - Beneficiary
      summary: Find Beneficiary
      description: Deprecated
      operationId: findBeneficiary
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountBankDetailsRequest
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AccountBankDetailsRequest'
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewPersonalAccountsResponse'
        '404':
          description: Beneficiary not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
  /customers:
    post:
      tags:
      - Customer
      summary: Create Customer
      description: ''
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCustomerRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewCustomerBaseResponse'
        '400':
          description: Bad request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
  /customers/{customerId}/lending/lender:
    post:
      tags:
      - Lending - Lender
      summary: Create a lender configuration
      description: ''
      operationId: createLenderConfiguration
      parameters:
      - name: customerId
        in: path
        description: Customer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      - name: lenderConfigurationRequest
        in: query
        description: Lender configuration request. Cannot be null.
        required: true
        schema:
          $ref: '#/components/schemas/LenderConfigurationBaseRequest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LenderConfigurationBaseRequest'
        required: true
      responses:
        '200':
          description: Lender configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkLenderConfigurationBaseResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
    get:
      tags:
      - Lending - Lender
      summary: Get a lender configuration
      description: ''
      operationId: getLenderConfiguration
      parameters:
      - name: customerId
        in: path
        description: Customer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Lender configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkLenderConfigurationBaseResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
    put:
      tags:
      - Lending - Lender
      summary: Update a lender configuration
      description: ''
      operationId: updateLenderConfiguration
      parameters:
      - name: customerId
        in: path
        description: Customer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      - name: lenderConfigurationRequest
        in: query
        description: Lender configuration request. Cannot be null.
        required: true
        schema:
          $ref: '#/components/schemas/LenderConfigurationBaseRequest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LenderConfigurationBaseRequest'
        required: true
      responses:
        '200':
          description: Lender configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkLenderConfigurationBaseResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /customers/{customerId}/lending/requests:
    post:
      tags:
      - Lending - Loan - Request
      summary: Create a lending request
      description: ''
      operationId: createLendingRequest
      parameters:
      - name: customerId
        in: path
        description: Customer ID. Cannot be null or empty.
        required: true
        schema:
          type: string
      - name: lendingRequestRequest
        in: query
        description: Lending request request. Cannot be null.
        required: true
        schema:
          $ref: '#/components/schemas/LendingRequestBaseRequest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LendingRequestBaseRequest'
        required: true
      responses:
        '200':
          description: Lending request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkLendingRequestBaseResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /customers/{customerId}/onboarding/createMerchant:
    post:
      tags:
      - Onboarding
      summary: Create Merchant
      description: Creates a new merchant for the specified customer. This is the
        first step in the onboarding process and will only be called if canRunCompliance
        capability is set to true.
      operationId: createMerchant
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '404':
          description: CUSTOMER_NOT_FOUND
  /customers/{customerId}/clients/{clientId}/accounts/{accountId}:
    delete:
      tags:
      - Account
      summary: Delete account
      description: ''
      operationId: deleteAccount
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account successfully deleted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '400':
          description: BAD_REQUEST
        '404':
          description: ACCOUNT_CLIENT_NOT_FOUND
        '417':
          description: ERROR_CLOSING_ACCOUNT
        '500':
          description: ERROR_CLOSING_ACCOUNT
    get:
      tags:
      - Account
      summary: Get account
      description: ''
      operationId: getAccount
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account details successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkAccountBaseResponse'
        '400':
          description: BAD_REQUEST
        '404':
          description: ERROR_CLIENT_NOT_FOUND
        '500':
          description: INVALID_CLIENT_CONFIGURATION
    put:
      tags:
      - Account
      summary: Update account
      description: ''
      operationId: updateAccount
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBaseRequest'
        required: true
      responses:
        '200':
          description: Account details successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkAccountBaseResponse'
        '400':
          description: BAD_REQUEST
        '404':
          description: ACCOUNT_NOT_FOUND_FOR_CLIENT
        '500':
          description: FUNCTION_NOT_IMPLEMENTED_YET
  /customers/{customerId}/clients/{clientId}/beneficiaries/{accountId}:
    delete:
      tags:
      - Beneficiary
      summary: Delete Beneficiary
      description: ''
      operationId: deleteBeneficiary
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '404':
          description: CUSTOMER_NOT_FOUND
    put:
      tags:
      - Beneficiary
      summary: Update Beneficiary
      description: 'Updates an existing beneficiary. Profile fields (name, address
        and visibility) can be edited. Bank-account detail fields are immutable: they
        are captured at creation and marked read-only on the update request body,
        so any value supplied for them is ignored and the stored value is preserved
        before the request is forwarded to the provider.'
      operationId: updateBeneficiary
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalAccountRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewPersonalAccountResponse'
        '404':
          description: CUSTOMER_NOT_FOUND
  /customers/{customerId}/meaWallet:
    delete:
      tags:
      - MeaWallet
      summary: Delete Mea Wallet
      description: Deprecated
      operationId: deleteMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '400':
          description: Deletion failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
    get:
      tags:
      - MeaWallet
      summary: Get Mea Wallet API Config
      description: Deprecated
      operationId: getMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkMeaConfigResponse'
        '400':
          description: Invalid input parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeaConfigResponse'
        '500':
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeaConfigResponse'
    put:
      tags:
      - MeaWallet
      summary: Update MEA Wallet API Configuration
      description: Deprecated
      operationId: updateMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeaConfigRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkMeaConfigResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
  /customers/{customerId}/transactions:
    get:
      tags:
      - Transaction
      summary: Fetch transactions
      operationId: fetchTransactions
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToqioHttpOkFetchAllTransactionsInSpecifiedTimeRangeResponse'
        '404':
          description: FUNCTION_NOT_IMPLEMENTED_YET
    post:
      tags:
      - Transaction
      summary: Save Transfer
      description: ''
      operationId: saveTransfer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransferBaseRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkSyncTransactionResponse'
        '404':
          description: ERROR_ACCOUNT_NOT_FOUND
        '500':
          description: INVALID_REMOTE_ACCOUNT_CONFIGURATION
  /customers/{customerId}/clients/{clientId}/accounts/{accountId}/bankStatement:
    post:
      tags:
      - Account
      summary: Find account transaction list statement
      description: ''
      operationId: findAccountTransactionListStatement
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateRange'
        required: true
      responses:
        '200':
          description: List of account transactions successfully retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToqioHttpOkStatementTransactionDTOFromBankResponse'
        '400':
          description: BAD_REQUEST
        '404':
          description: ACCOUNT_NOT_FOUND
  /customers/{customerId}/clients/{clientId}/accounts/{accountId}/bankStatementOtp:
    post:
      tags:
      - Account
      summary: Find account transaction list statement
      description: ''
      operationId: findAccountTransactionListStatement_1
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementSendData'
        required: true
      responses:
        '200':
          description: List of account transactions successfully retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToqioHttpOkStatementTransactionDTOFromBankResponse'
        '404':
          description: ACCOUNT_NOT_FOUND
  /customers/{customerId}:
    get:
      tags:
      - Customer
      summary: Find Customer
      description: ''
      operationId: findCustomer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewCustomerBaseResponse'
        '404':
          description: CUSTOMER_NOT_FOUND
  /customers/{customerId}/merchants/{merchantId}/accounts/{accountId}/certificates/ownership:
    get:
      tags:
      - Account
      summary: Get account ownership certificate
      operationId: getAccountOwnershipCertificate
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: String encoded in base 64 that represents the PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkStringResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /customers/{customerId}/assetTypes:
    get:
      tags:
      - Customer
      summary: Get Asset Types
      description: ''
      operationId: getAssetTypes
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkAssetTypeResponse'
        '404':
          description: Bank not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentNotFoundException'
  /customers/{customerId}/transactions/bankPaymentSchemes:
    post:
      tags:
      - Transaction
      summary: Get bank payment schemes
      description: ''
      operationId: getBankPaymentSchemes
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankPaymentSchemeRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkBankPaymentSchemeResponse'
        '404':
          description: BANK_NOT_FOUND
        '500':
          description: INTERNAL_SERVER_ERROR
  /customers/{customerId}/ledgerType/{ledgerType}/bankStatement/footer/{locale}:
    get:
      tags:
      - Transaction
      summary: Get bank statement footer
      description: Returns the footer text for a customer's bank statement based,
        ledger type, and locale.
      operationId: getBankStatementFooter
      parameters:
      - name: customerId
        in: path
        description: Customer ID
        required: true
        schema:
          type: string
      - name: ledgerType
        in: path
        description: Ledger type (regular, acquiring, lending, pos, insurance, deposit,
          credit)
        required: true
        schema:
          type: string
      - name: locale
        in: path
        description: Locale in the format language_COUNTRY (e.g., es-ES, en-US)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation - footer text returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkStringResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /customers/{customerId}/clients/{clientId}/account/{accountId}/beneficiaries/{beneficiaryId}:
    get:
      tags:
      - Beneficiary
      summary: Get Beneficiary
      description: ''
      operationId: getBeneficiary
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: beneficiaryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkViewPersonalAccountResponse'
        '404':
          description: Beneficiary not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentNotFoundException'
  /customers/{customerId}/clients/{clientId}/beneficiaries/filters:
    post:
      tags:
      - Beneficiary
      summary: Get Beneficiary Filters
      description: Returns the available filters for beneficiary operations (payments,
        beneficiary listing, and beneficiary creation). The response includes the
        permitted asset types (currencies) and countries based on the source account
        characteristics. This allows the client to filter beneficiaries by supported
        currencies and countries according to the integration's business rules.
      operationId: getBeneficiaryFilters
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryFilterRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkBeneficiaryFilterResponse'
        '404':
          description: ' CUSTOMER_NOT_FOUND'
  /customers/{customerId}/currencies:
    get:
      tags:
      - Customer
      summary: Get available currencies for a customer
      description: ''
      operationId: getBillingCurrencies
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Currencies retrieved successfully
          content:
