    PaymentOptionsResponse:
      type: object
      description: Contains the payment options for a specific source account. Currently,
        the only option is the beneficiary selection mode, which determines what kind
        of beneficiaries the user can choose as the destination when making a payment
        from this account.
      properties:
        beneficiarySelectionMode:
          $ref: '#/components/schemas/BeneficiarySelectionMode'
      required:
      - beneficiarySelectionMode
    BeneficiarySelectionMode:
      type: string
      description: 'Defines the restrictions on which beneficiaries a user can select
        as the destination of a payment originating from a specific source account.
        The connector returns this value based on its own business rules, account
        type, or regulatory constraints.


        - `ANY_BENEFICIARY_ANY_PROVIDER`: No restrictions. The user can select any
        beneficiary across any BaaS provider. This is the default behavior if the
        connector does not implement the payment-options endpoint.

        - `MERCHANT_ACCOUNTS_ANY_PROVIDER`: Only the merchant''s own Toqio accounts
        can be selected as destination, regardless of which BaaS provider holds them.
        Payments must stay within the merchant''s own accounts but can cross provider
        boundaries.

        - `MERCHANT_ACCOUNTS_SAME_PROVIDER`: Only the merchant''s own Toqio accounts
        held at the same BaaS provider as the source account can be selected. This
        is the most restrictive mode — payments must stay within the same provider''s
        infrastructure.'
      enum:
      - ANY_BENEFICIARY_ANY_PROVIDER
      - MERCHANT_ACCOUNTS_ANY_PROVIDER
      - MERCHANT_ACCOUNTS_SAME_PROVIDER
