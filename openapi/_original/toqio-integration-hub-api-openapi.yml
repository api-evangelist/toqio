  /customers/{customerId}/products/changes:
    post:
      tags:
      - Products
      summary: Notify product changes for a customer
      description: 'This endpoint is called by Integration Hub to notify downstream
        banking provider systems about product changes that occurred in the Wallet
        system. The endpoint should be implemented by third-party banking providers
        to receive and process product change notifications.


        When this endpoint is called, it indicates that products associated with a
        customer have been modified in the Wallet system and need to be synchronized
        in the banking provider''s system. The notification can contain:


        - **Products to upsert**: A list of products that should be created if they
        don''t exist, or updated if they already exist in the provider''s system.
        Each product contains complete information including account details, balances,
        status, and metadata.


        - **Products to delete**: A list of product IDs that should be removed from
        the provider''s system. These are products that have been deleted or deactivated
        in the Wallet and should no longer be accessible.


        The provider system receiving this notification should:

        1. Validate that the customerId corresponds to an existing customer in their
        system

        2. Process all product upserts by creating new products or updating existing
        ones based on the product ID

        3. Process all product deletions by removing or deactivating the specified
        products

        4. Return a successful response (HTTP 200) if all operations completed successfully

        5. Return an error response (HTTP 400/404) if validation fails or operations
        cannot be completed


        The endpoint is idempotent - calling it multiple times with the same data
        should produce the same result. Product upserts should use the product ID
        as the unique identifier to determine whether to create or update.


        This is a critical synchronization point to ensure consistency between Toqio
        and the integration products catalog for each customer.'
      operationId: notifyProductChanges
      parameters:
      - name: customerId
        in: path
        description: The unique identifier of the customer in the banking provider's
          system. This ID must correspond to an existing customer record. All product
          changes in the request will be associated with this customer.
        required: true
        schema:
          type: string
      requestBody:
        description: The product change notification containing products to create/update
          (upsert) and/or product IDs to delete. At least one of the arrays (products
          or deleteProductIds) should be provided, though both can be included in
          a single request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductChangeNotificationRequest'
      responses:
        '200':
          description: Product changes were successfully processed. All upsert and
            delete operations completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '400':
          description: Bad request. The request body is invalid, malformed, or contains
            invalid product data. This may occur if required fields are missing, field
            values are out of valid ranges, or the request structure doesn't match
            the expected schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomException'
              example:
                code: INVALID_REQUEST
                errorSeverity: ERROR
                message: 'Invalid request body: required field ''id'' is missing in
                  product at index 0'
                httpStatus: 400
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: '2024-08-01T10:30:00.000Z'
                errorOrigin: INTEGRATION_HUB
        '404':
          description: Customer not found. The specified customerId does not exist
            in the banking provider's system. Product changes cannot be processed
            for non-existent customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomException'
              example:
                code: CUSTOMER_NOT_FOUND
                errorSeverity: ERROR
                message: Customer with ID 'cust_123' does not exist in the system
                httpStatus: 404
                requestId: 7c8d9e0f-12a3-45b6-c789-d0e1f2a3b4c5
                date: '2024-08-01T10:30:00.000Z'
                errorOrigin: INTEGRATION_HUB
