    ProductChangeNotificationRequest:
      type: object
      description: Request payload for notifying product changes from Toqio to the
        integrations. This endpoint is called BY Integration Hub TO the banking provider
        integration to synchronize product information. The integration should implement
        this endpoint to receive product updates (upserts) and deletions.
      properties:
        products:
          type: array
          description: List of products to create or update (upsert). Each product
            in this array should be processed idempotently - if a product with the
            given ID already exists in the connector, it should be updated; if it
            doesn't exist, it should be created. This array can be null or empty if
            there are only deletions to process.
          items:
            $ref: '#/components/schemas/ProductNotificationItemDTO'
        deleteProductIds:
          type: array
          description: List of product IDs to delete from the connector. The connector
            should remove these products or mark them as inactive. These are product
            IDs that were previously sent in the 'products' array but should now be
            deleted. This array can be null or empty if there are only upserts to
            process.
          items:
            type: string
            description: Unique identifier of the product to delete.
      example:
        products:
        - id: prod_123
          partnerProduct: EUR
          bankingProvider: provider_xyz
          name:
            en: Current Account
            es: Cuenta Corriente
          description:
            en: Standard current account for daily transactions
            es: Cuenta corriente estándar para transacciones diarias
          customerId: cust_456
          ledgerTypeId: ledger_789
          visible: true
          isCore: true
          productImageUrl: https://example.com/images/current-account.png
          marketplaceKey: null
        deleteProductIds:
        - prod_old_123
        - prod_old_456
    ProductNotificationItemDTO:
      type: object
      description: Individual product item in a product change notification. Contains
        essential product information needed for synchronization between Toqio and
        the connector. The integration should store these fields to maintain an accurate
        representation of the customer's products.
      required:
      - id
      - customerId
      - partnerProduct
      - bankingProvider
      - name
      - ledgerTypeId
      - visible
      properties:
        id:
          type: string
          description: Unique identifier of the product. This is the primary key used
            to identify the product across systems. Use this ID for update operations
            and when referencing the product in subsequent API calls.
        partnerProduct:
          type: string
          description: Partner product code that identifies the type/category of the
            product. This is a string code defined in the provider catalog. The integration
            should use this code to understand what type of product this is and apply
            appropriate business rules.
          example: EUR
        bankingProvider:
          type: string
          description: Identifier of the banking provider that manages this product.
            This corresponds to the connector identifier configured in Toqio's system.
            The integration receiving this notification should verify that this value
            matches their own identifier.
          example: provider_xyz
        name:
          allOf:
          - $ref: '#/components/schemas/I18nLabel'
          description: Internationalized name of the product. Contains translations
            in multiple languages (Spanish, English, German, Italian, Chinese, Portuguese).
            The provider should display this name to end users in their preferred
            language. At least english language should be provided.
        description:
          allOf:
          - $ref: '#/components/schemas/I18nLabel'
          description: Internationalized description of the product. Contains detailed
            information about the product in multiple languages. The Toqio FE displays
            this description to end users when showing product details. Can be null
            if no description is available.
        customerId:
          type: string
          description: Unique identifier of the customer who owns this product. This
            links the product to a specific customer in the connector's system. The
            integration must ensure this customer exists before creating the product.
        ledgerTypeId:
          type: string
          description: Identifier of the ledger type associated with this product.
            This defines the accounting rules allowed for this product. The integration
            should use this to identify the product.
          example: ledger_standard_checking
        visible:
          type: boolean
          description: Indicates whether this product should be visible to the end
            user in the provider's interfaces (mobile app, web banking, etc.). If
            false, the product exists but should not be displayed to the merchant.
            This is useful for internal products or products in a pending state.
          example: true
        isCore:
          type: boolean
          description: Indicates whether this is a core banking product (true) or
            an marketplace product (false). Core products are created by default by
            Toqio system, and can't be modified by the customers. Are related to regular
            ledgerTypeId and core ledger system of Toqio.
          example: true
        productImageUrl:
          type: string
          format: uri
          description: URL to the image/icon representing this product. Can be null
            if no image is available.
          example: https://cdn.toqio.com/products/current-account.png
        marketplaceKey:
          type: string
          description: Unique key relating this product with an app in marketplace
            context. This key is used to link the product to a specific marketplace
            application. Can be null (or 'regular') for core banking products.
          example: marketplace_insurance_home_basic
      example:
        id: prod_7890abc
        partnerProduct: SAVINGS_ACCOUNT
        bankingProvider: provider_xyz
        name:
          en: High Yield Savings
          es: Ahorro de Alto Rendimiento
        description:
          en: Earn competitive interest rates on your savings
          es: Gana tasas de interés competitivas en tus ahorros
        customerId: cust_456
        ledgerTypeId: ledger_savings
        visible: true
        isCore: true
        productImageUrl: https://cdn.toqio.com/products/savings.png
        marketplaceKey: null
