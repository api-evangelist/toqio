  /customers/{customerId}/clients/{clientId}/beneficiaries/verify:
    post:
      tags:
      - Beneficiary
      summary: Verify beneficiary for a client
      description: Verifies beneficiary information for a client before proceeding
        with a payment. This endpoint validates beneficiary details and returns verification
        status.
      operationId: verifyBeneficiaryCompany
      parameters:
      - name: customerId
        in: path
        description: Unique identifier of the customer
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: Unique identifier of the company
        required: true
        schema:
          type: string
      requestBody:
        description: Beneficiary verification request containing source account, payment
          type, and beneficiary details. This object extends AdditionalParams and
          can include additional custom validation parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyBeneficiaryRequest'
            examples:
              standardPropertiesOnly:
                summary: Request with standard properties only
                description: Basic verification request with only the standard required
                  fields
                value:
                  sourceAccountId: acc-12345
                  paymentType: PAYMENT_TYPE_EU_SEPA_INSTANT
                  beneficiaryId: ben-67890
              withAdditionalProperties:
                summary: Request with additional custom properties
                description: Verification request including additional custom validation
                  parameters beyond standard fields
                value:
                  sourceAccountId: acc-12345
                  paymentType: PAYMENT_TYPE_EU_SEPA_INSTANT
                  beneficiaryId: ben-67890
                  _comment: '--- Additional Custom Properties Below (dynamic based
                    on system config) ---'
                  complianceCheckLevel: ENHANCED
                  sanctionsScreening: true
                  pepCheck: true
                  fraudCheckEnabled: true
                  riskScore: 85.5
                  verificationMethod: AUTOMATED
      responses:
        '200':
          description: Beneficiary verification completed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVerifyBeneficiaryResponse'
              examples:
                matched:
                  summary: Beneficiary fully matched
                  description: Response when beneficiary details are fully matched
                    and payment can proceed
                  value:
                    data:
                      status: MATCHED
                      reasonCode: FULL_MATCH
                      reasonDescription: All beneficiary details matched successfully
                      allowProceedPayment: true
                    code: '200'
                    message: Beneficiary verified
                    httpStatus: 200
                    requestId: req-987654
                    date: '2025-11-14T10:30:00Z'
                partiallyMatched:
                  summary: Beneficiary partially matched
                  description: Response when some beneficiary details matched but
                    not all
                  value:
                    data:
                      status: PARTIALLY_MATCHED
                      reasonCode: NAME_MISMATCH
                      reasonDescription: Beneficiary account matched but name differs
                        slightly
                      allowProceedPayment: true
                    code: '200'
                    message: Beneficiary partially verified
                    httpStatus: 200
                    requestId: req-987654
                    date: '2025-11-14T10:30:00Z'
                withAdditionalProperties:
                  summary: Response with additional custom properties
                  description: Verification response including additional custom verification
                    data
                  value:
                    data:
                      status: MATCHED
                      reasonCode: FULL_MATCH
                      reasonDescription: All beneficiary details matched successfully
                      allowProceedPayment: true
                      _comment: '--- Additional Custom Properties Below (dynamic based
                        on system config) ---'
                      verificationId: verify-xyz123
                      verificationTimestamp: '2025-11-14T10:30:00Z'
                      matchScore: 98.5
                      complianceStatus: CLEARED
                      sanctionsMatch: false
                      pepMatch: false
                      fraudRiskLevel: LOW
                      verificationProvider: PROVIDER_A
                      additionalChecksPerformed:
                      - SANCTIONS
                      - PEP
                      - FRAUD
                      expiryTimestamp: '2025-11-14T11:30:00Z'
                    code: '200'
                    message: Beneficiary verified
                    httpStatus: 200
                    requestId: req-987654
                    date: '2025-11-14T10:30:00Z'
        '404':
          description: ' CUSTOMER_NOT_FOUND'
