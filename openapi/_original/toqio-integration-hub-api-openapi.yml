    VerifyBeneficiaryResponse:
      type: object
      description: Response containing the result of beneficiary verification. This
        object extends AdditionalParams and may include additional verification metadata
        and custom validation results beyond the standard properties.
      required:
      - status
      properties:
        status:
          type: string
          description: Verification status indicating the result of the beneficiary
            check - STANDARD PROPERTY
          enum:
          - MATCHED
          - PARTIALLY_MATCHED
          - NOT_MATCHED
          - NOT_APPLIED
          - UNAVAILABLE
          x-enum-descriptions:
            MATCHED: Beneficiary details fully matched - verification successful
            PARTIALLY_MATCHED: Beneficiary details partially matched - some discrepancies
              found but may proceed
            NOT_MATCHED: Beneficiary details do not match - verification failed
            NOT_APPLIED: Verification was not applied or not required for this transaction
            UNAVAILABLE: Verification service unavailable at this time
          example: MATCHED
        reasonCode:
          type: string
          description: Code indicating the specific reason for the verification result
            - STANDARD PROPERTY
          example: FULL_MATCH
        reasonDescription:
          type: string
          description: Human-readable description explaining the verification result
            - STANDARD PROPERTY
          example: All beneficiary details matched successfully
        allowProceedPayment:
          type: boolean
          description: Flag indicating whether the payment can proceed based on verification
            results - STANDARD PROPERTY
          example: true
      additionalProperties:
        oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: object
        - type: array
        description: 'ADDITIONAL CUSTOM PROPERTIES: Dynamic properties based on your
          system configuration. Common examples include: verificationId (string),
          verificationTimestamp (string/datetime), matchScore (number), complianceStatus
          (string), sanctionsMatch (boolean), pepMatch (boolean), fraudRiskLevel (string),
          verificationProvider (string), additionalChecksPerformed (array), expiryTimestamp
          (string/datetime), and any other custom verification metadata defined in
          your system.'
