openapi: 3.0.1
info:
  title: Card Management API
  description: Comprehensive API for managing customer cards including physical and
    virtual cards, debit and credit cards, with full lifecycle management
  version: 1.0.0
  contact:
    name: Toqio Integration Hub
servers:
- url: https://your_connector_url/
  description: Your connector base URL
paths:
  /customers/{customerId}/cards/{cardId}/activate:
    put:
      tags:
      - Card Lifecycle
      - Security
      summary: Activate card
      description: 'Activates (unfreezes) a suspended card. Requires card token for
        activation.


        **Business Context**: Called when a cardholder or administrator wants to activate
        a suspended card. The activation reason is determined by the requester''s
        role (owner, director, or admin). Requires security code verification.'
      operationId: activateCard
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokenRequest'
      responses:
        '200':
          description: Card activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
  /customers/{customerId}/cards/{cardId}/activateOTP:
    put:
      tags:
      - Card Lifecycle
      - Security
      summary: Activate card with OTP verification
      description: 'Activates a card using OTP (One-Time Password) verification for
        enhanced security.


        **Business Context**: Used when the banking provider requires OTP verification
        for card activation (e.g., first-time activation).'
      operationId: activateCardOTP
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardOTP'
            example:
              baasOTP: '123456'
              operationId: op-12345
              userId: user-789
              cardTokenRequest:
                token: activation-token-xyz
      responses:
        '200':
          description: Card activated successfully with OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
        '401':
          description: Invalid OTP
  /customers/{customerId}/cards/{cardId}/cancel:
    put:
      tags:
      - Card Lifecycle
      summary: Cancel card
      description: 'Permanently cancels a card. Unlike suspend, a cancelled card cannot
        be reactivated.


        **Business Context**: Used when permanently deactivating a card (e.g., employee
        termination, compromised card). The card is removed from the available cards
        list in the frontend but remains in the system for audit purposes.'
      operationId: cancelCard
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
  /customers/{customerId}/cards/accounts/{accountId}/scheduledPayment/{scheduledPaymentId}/cancel:
    post:
      tags:
      - Credit Cards
      summary: Cancel scheduled payment
      description: 'Cancels a previously scheduled credit card payment.


        **Business Context**: Allows users to cancel scheduled payments before they
        are executed.'
      operationId: cancelScheduledPayment
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: scheduledPaymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scheduled payment cancelled successfully
  /customers/{customerId}/cards/{cardId}:
    delete:
      tags:
      - Card Lifecycle
      summary: Delete card
      description: 'Permanently deletes a card from the system.


        **Business Context**: Used for complete card removal from both the system
        and banking provider.'
      operationId: deleteCard
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: cardId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Card deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
    get:
      tags:
      - Card Lifecycle
      summary: Get card details
      description: 'Retrieves detailed information about a specific card. Automatically
        syncs the card status from the banking provider to ensure consistency.


        **Business Context**: Called when viewing card details in the frontend application.
        Returns full card information including limits, status, and associated account
        details that are displayed to the user.


        **IMPORTANT - Card Limits**: The integration MUST return all card limits that
        are currently defined for the card (i.e. cardLimitDaily, cardLimitMonthly,
        cardLimitTransaction, or any custom limits). If a limit is defined for the
        card but not returned in the response, the system will not be able to display
        it correctly or will show outdated information. Only return the limits that
        are actually configured for this specific card - do not return limits that
        have not been set.'
      operationId: getCard
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
        example: cust-123
      - name: cardId
        in: path
        required: true
        schema:
          type: string
        example: card-abc123
      responses:
        '200':
          description: Card details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customerId}/cards/account/{accountId}/companies/{companyId}/creditStatements:
    get:
      tags:
      - Credit Cards
      summary: Fetch credit card statements
      description: 'Retrieves credit card billing statements.


        **Business Context**: Allows users to view their credit card statements showing
        transactions, payments, and balance information.'
      operationId: fetchCreditStatement
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credit statement retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreditStatementResponse'
  /customers/{customerId}/availableCardLimits:
    get:
      tags:
      - Card Limits
      summary: Get available card limit types
      description: 'Retrieves the list of available card limit types configured in
        the system. Use this endpoint to discover which custom limits can be set when
        creating or updating cards.


        **Business Context**: Called to dynamically discover which limit fields are
        available for configuration. This allows the frontend UI to adapt to different
        banking provider capabilities and custom limit configurations.


        **Note**: The response includes all supported limit types, but the integration
        is not required to return all of them. Only return the limits that are actually
        configured in your system. Any limit not included in the response will be
        interpreted as null and ignored.'
      operationId: getAvailableCardLimits
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Available card limits retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseAvailableCardLimitsResponse'
              example:
                data:
                  transactionLimit:
                    canEdit: true
                    optional: false
                  dailyLimit:
                    canEdit: true
                    optional: false
                  monthlyLimit:
                    canEdit: true
                    optional: false
                  lifetimeLimit:
                    canEdit: true
                    optional: true
                  purchasesDailyLimit:
                    canEdit: true
                    optional: true
                  purchasesMonthlyLimit:
                    canEdit: true
                    optional: true
                  atmDailyLimit:
                    canEdit: true
                    optional: true
                  atmMonthlyLimit:
                    canEdit: true
                    optional: true
                  atmOperationsLimit:
                    canEdit: true
                    optional: true
                  purchasesOperationsLimit:
                    canEdit: true
                    optional: true
                code: '200'
                message: Available card limits retrieved successfully
                httpStatus: 200
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: 1736935800000
  /customers/{customerId}/cards/{cardId}/image/url:
    get:
      tags:
      - Card Details
      summary: Get card image URL
      description: 'Retrieves the URL for the card''s visual design image.


        **Business Context**: Used to display card artwork in the frontend application.
        Returns the URL of the card image that can be rendered in the UI.'
      operationId: getCardImageUrl
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card image URL retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseString'
              example:
                data: https://cdn.provider.com/card-designs/corporate-blue-123.png
                code: '200'
                message: Card image URL retrieved successfully
                httpStatus: 200
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: 1736935800000
  /customers/{customerId}/cards/image/url:
    get:
      tags:
      - Card Details
      summary: Get card image URL by template
      description: 'Retrieves the card image URL based on the customer''s default
        card template/design.


        **Business Context**: Used to show the default card design before a card is
        issued, helping users preview what their card will look like.'
      operationId: getCardImageUrlByTemplate
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Template card image URL retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseString'
  /customers/{customerId}/cards/type/{cardType}/clientType/{clientType}/limits/{currency}:
    get:
      tags:
      - Card Limits
      summary: Get card limit constraints (min/max values)
      description: 'Retrieves the minimum and maximum allowed values for card limits
        based on card type, client type, and currency. This endpoint returns standard
        limit constraints and may include additional custom limit constraints configured
        in your system.


        **Business Context**: Called when displaying the card issuance form or limit
        update form in the frontend to show users the allowable range for each limit
        type. Helps validate user input before submission.'
      operationId: getCardLimitsMinMax
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: cardType
        in: path
        required: true
        schema:
          type: string
          enum:
          - DEBIT
          - CREDIT
          - PREPAID
        example: DEBIT
      - name: clientType
        in: path
        required: true
        schema:
          type: string
          enum:
          - BUSINESS
          - CONSUMER
        example: BUSINESS
      - name: currency
        in: path
        required: true
        schema:
          type: string
        example: EUR
      - name: merchant
        in: query
        required: false
        schema:
          type: string
        description: Optional merchant identifier for merchant-specific limits
      responses:
        '200':
          description: Card limit constraints retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardLimitsMinMaxResponse'
              examples:
                standard:
                  summary: Standard properties only
                  value:
                    data:
                      provider: MODULR
                      currency: EUR
                      minDailyLimit: 100
                      maxDailyLimit: 5000
                      minMonthlyLimit: 500
                      maxMonthlyLimit: 20000
                      minTransactionLimit: 10
                      maxTransactionLimit: 2000
                      minLifetimeSpendLimit: 1000
                      maxLifetimeSpendLimit: 100000
                    code: '200'
                    message: Card limit constraints retrieved successfully
                    httpStatus: 200
                    requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                    date: 1736935800000
                withCustomLimits:
                  summary: With additional custom limit constraints
                  value:
                    data:
                      provider: MODULR
                      currency: EUR
                      minDailyLimit: 100
                      maxDailyLimit: 5000
                      minMonthlyLimit: 500
                      maxMonthlyLimit: 20000
                      minTransactionLimit: 10
                      maxTransactionLimit: 2000
                      minLifetimeSpendLimit: 1000
                      maxLifetimeSpendLimit: 100000
                      minPurchasesDailyLimit: 50
                      maxPurchasesDailyLimit: 3000
                      minAtmDailyLimit: 50
                      maxAtmDailyLimit: 1000
                      minAtmOperationsLimit: 1
                      maxAtmOperationsLimit: 10
                    code: '200'
                    message: Card limit constraints retrieved successfully
                    httpStatus: 200
                    requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                    date: 1736935800000
  /customers/{customerId}/cards/{cardId}/settings:
    get:
      tags:
      - Card Details
      summary: Get card settings
      description: 'Retrieves configuration settings for a specific card from the
        banking provider.


        **Business Context**: Used to retrieve provider-specific card configuration
        and capabilities.'
      operationId: getCardSettings
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardSettingsResponse'
  /customers/{customerId}/cards/account/{accountId}/company/{companyId}/creditDetails:
    get:
      tags:
      - Credit Cards
      summary: Get credit card details
      description: 'Retrieves detailed credit card account information including balance,
        available credit, and payment status.


        **Business Context**: Displays current credit card account status in the frontend
        application.'
      operationId: getCreditDetails
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credit details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreditDetailsRequest'
  /customers/{customerId}/cards/{cardId}/pan:
    post:
      tags:
      - Card Details
      - Security
      summary: Get card PAN (Primary Account Number)
      description: 'Retrieves sensitive card details including PAN, CVV, and expiry
        date. Requires security verification (encrypted security code).


        **Business Context**: Called when user needs to view full card details. Security
        code is encrypted using RSA public key before transmission. Supports both
        standard encryption and MEA Wallet wrapped key encryption.'
      operationId: getPan
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        description: Security parameters for PAN retrieval (encrypted security code)
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encryptedSecurityCode:
                  type: string
                  description: RSA-encrypted security code
                wrappedKey:
                  type: string
                  description: MEA Wallet wrapped key (if using MEA Wallet encryption)
                iv:
                  type: string
                  description: Initialization vector for encryption
                tag:
                  type: string
                  description: Authentication tag for encryption
              required:
              - encryptedSecurityCode
      responses:
        '200':
          description: PAN retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardPanResponse'
        '401':
          description: Unauthorized - Invalid security code
  /customers/{customerId}/cards/client/{clientId}/partnerToken:
    get:
      tags:
      - Credit Cards
      - Security
      summary: Get partner token
      description: 'Retrieves a partner integration token for credit card operations.


        **Business Context**: Used when integrating with third-party services for
        credit card account linking and payments.'
      operationId: getPartnerToken
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Partner token retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartnerTokenResponse'
  /customers/{customerId}/cards/{cardId}/pin:
    get:
      tags:
      - Card Details
      - Security
      summary: Get card PIN
      description: 'Retrieves the card PIN number. Requires elevated security permissions.


        **Business Context**: Used when cardholder needs to retrieve their PIN for
        ATM or POS transactions.'
      operationId: getPin
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: PIN retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponsePinResponse'
  /customers/{customerId}/cards/{cardId}/pin/async:
    get:
      tags:
      - Card Details
      - Security
      summary: Get card PIN asynchronously (POC only)
      description: Asynchronous PIN retrieval endpoint for proof-of-concept testing
        only. Not for production use.
      operationId: getPinAsync
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '202':
          description: PIN retrieval initiated
  /customers/{customerId}/card/{cardId}/secret:
    get:
      tags:
      - Security
      summary: Get TOTP secret for card
      description: 'Retrieves the Time-based One-Time Password (TOTP) secret for the
        card. Used with authenticator apps for enhanced security.


        **Business Context**: Called when setting up TOTP-based authentication (e.g.,
        Google Authenticator, Authy) for card transactions. Requires that the banking
        provider supports MEA Wallet configuration.'
      operationId: getTOTPSecret
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: TOTP secret retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseString'
              example:
                data: JBSWY3DPEHPK3PXP
                code: '200'
                message: TOTP secret retrieved successfully
                httpStatus: 200
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: 1736935800000
        '501':
          description: TOTP not supported by this provider
  /customers/{customerId}/cards:
    post:
      tags:
      - Card Lifecycle
      summary: Issue a new card
      description: 'Creates and issues a new physical or virtual card for a customer.
        This endpoint handles both debit and credit cards, supports custom card designs,
        delivery addresses, and limit configurations. The card will be created in
        the banking provider system.


        **Business Context**: Used when issuing a card to a user or creating a company
        card. The card details returned are displayed in the frontend application.
        Supports multi-company scenarios where different merchants can issue cards.'
      operationId: issueCard
      parameters:
      - name: customerId
        in: path
        description: Unique identifier of the customer (top-level entity)
        required: true
        schema:
          type: string
        example: cust-123
      requestBody:
        description: Card issuance request containing all necessary information to
          create a new card
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
            examples:
              virtualDebitCard:
                summary: Issue virtual debit card for employee
                value:
                  accountId: acc-789
                  userId: user-456
                  companyId: company-123
                  physical: false
                  nameOnCard: John Doe
                  cardLimitDaily: 1000
                  cardLimitMonthly: 5000
                  cardLimitTransaction: 500
                  currency: EUR
                  cardProgramme: STANDARD
                  cardDesign: corporate-blue
              physicalCard:
                summary: Issue physical card with delivery address
                value:
                  accountId: acc-789
                  userId: user-456
                  companyId: company-123
                  physical: true
                  nameOnCard: Jane Smith
                  cardDeliveryName: Jane Smith
                  cardDeliveryAddress:
                    addressStreet: 123 Main Street
                    addressNumber: '123'
                    addressCity: London
                    addressRegion: Greater London
                    addressPostalCode: SW1A 1AA
                    addressIsoCountry: GB
                  phone:
                    countryCode: '+44'
                    number: '7700900000'
                  email: jane.smith@company.com
                  cardLimitDaily: 2000
                  cardLimitMonthly: 10000
                  cardLimitTransaction: 1000
                  lifetimeSpendLimit: 50000
                  currency: GBP
      responses:
        '200':
          description: Card issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
              example:
                data:
                  id: card-abc123
                  token: tok_card_xyz789
                  status: PENDING
                  provider: MODULR
                  nameOnCard: John Doe
                  truncatedPan: '4321'
                  expiryDate: 12/27
                  cardProgramme: STANDARD
                  showCustomCardDesign: true
                  activationCodeLength: 6
                code: '200'
                message: Card issued successfully
                httpStatus: 200
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: 1736935800000
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}/cards/accounts/{accountId}/external-accounts:
    get:
      tags:
      - Credit Cards
      summary: Get linked external accounts
      description: 'Retrieves the list of external bank accounts linked to a credit
        card account for payment purposes.


        **Business Context**: Used in credit card management to display in the frontend
        which external accounts can be used to pay off the credit card balance.'
      operationId: linkedExternalAccounts
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: External accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAccountsResponse'
  /customers/{customerId}/cards/account/{accountId}/linkExternalAccount:
    post:
      tags:
      - Credit Cards
      summary: Link external account
      description: 'Links an external bank account to a credit card account for payment
        purposes.


        **Business Context**: Allows users to add external bank accounts that can
        be used to make payments on their credit card balance.'
      operationId: linkExternalAccount
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAccountLinkBodyRequest'
      responses:
        '200':
          description: External account linked successfully
  /customers/{customerId}/cards/account/{accountId}/company/{companyId}/creditDetails/{externalAccountId}:
    delete:
      tags:
      - Credit Cards
      summary: Remove linked external account
      description: 'Removes a linked external account from a credit card.


        **Business Context**: Allows users to unlink external bank accounts that are
        no longer needed for credit card payments.'
      operationId: removeLinkedExternalAccount
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      - name: externalAccountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: External account removed successfully
  /customers/{customerId}/cards/accounts/{accountId}/payments/schedule/autopay:
    post:
      tags:
      - Credit Cards
      summary: Schedule autopay
      description: 'Sets up automatic recurring payments for a credit card account.


        **Business Context**: Enables automatic payment of credit card balance (minimum
        payment, full balance, or fixed amount) on a recurring schedule.'
      operationId: scheduleAutoPay
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleAutopayRequest'
      responses:
        '200':
          description: Autopay scheduled successfully
  /customers/{customerId}/cards/accounts/{accountId}/scheduledCreditPayments:
    get:
      tags:
      - Credit Cards
      summary: Get scheduled credit payments
      description: 'Retrieves all scheduled payments for a credit card account.


        **Business Context**: Shows users their upcoming scheduled payments including
        one-time payments and autopay schedules.'
      operationId: scheduledCreditPayments
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scheduled payments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduledCreditPaymentsResponse'
  /customers/{customerId}/cards/accounts/{accountId}/schedule:
    post:
      tags:
      - Credit Cards
      summary: Schedule credit card payment
      description: 'Schedules a one-time payment for a credit card account.


        **Business Context**: Allows users to schedule a future payment from a linked
        external account to their credit card balance.'
      operationId: schedulePaymentCard
      parameters:
      - $ref: '#/components/parameters/customerId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePaymentCardRequest'
      responses:
        '200':
          description: Payment scheduled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduledCreditPaymentIdResponse'
  /customers/{customerId}/cards/{cardId}/suspend:
    put:
      tags:
      - Card Lifecycle
      - Security
      summary: Suspend card
      description: 'Suspends (freezes) a card temporarily. The card can be reactivated
        later.


        **Business Context**: Called when a cardholder temporarily freezes their card
        (e.g., lost wallet) or when a director/admin suspends an employee''s card.
        Requires security code verification.'
      operationId: suspendCard
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
  /customers/{customerId}/cards/{cardId}/update:
    put:
      tags:
      - Card Lifecycle
      - Card Limits
      summary: Update card details and limits
      description: "Updates card spending limits. This endpoint supports dynamic limit\
        \ types via AdditionalParams.\n\n**Business Context**: Called when adjusting\
        \ spending limits displayed in the frontend. For customers with enabled limit\
        \ management, this endpoint allows updating daily, monthly, transaction, and\
        \ lifetime limits. Additional custom limits (e.g., ATM limits, purchase limits)\
        \ can be included via additionalProperties.\n\n**Important**: \n- This endpoint\
        \ extends AdditionalParams, allowing custom limit fields to be passed. Query\
        \ GET /customers/{customerId}/availableCardLimits to discover which custom\
        \ limits are available in your system.\n- To update card alias, use the dedicated\
        \ endpoint PUT /customers/{customerId}/cards/{cardId}/alias instead."
      operationId: updateCard
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateCardRequest'
      responses:
        '200':
          description: Card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioResponseCardResponse'
              example:
                data:
                  id: card-abc123
                  token: tok_card_xyz789
                  status: ACTIVE
                  provider: MODULR
                  nameOnCard: John Doe
                  truncatedPan: '4321'
                  expiryDate: 12/27
                  spend: 2500
                  limit: 5000
                code: '200'
                message: Card updated successfully
                httpStatus: 200
                requestId: 26b0f78a-79f9-426d-a20b-79841345ae51
                date: 1736935800000
  /customers/{customerId}/cards/{cardId}/alias:
    put:
      tags:
      - Card Lifecycle
      summary: Update card alias
      description: "Updates the friendly name (alias) of a specific card. This endpoint\
        \ allows modifying only the card's display name without affecting other card\
        \ properties.\n\n**Business Context**: Called when a user wants to rename\
        \ their card for easier identification in the frontend application. The updated\
        \ alias is displayed across all card views and helps users distinguish between\
        \ multiple cards.\n\n**Important**: \n- This endpoint will only be called\
        \ if the integration has the capability `hasCardAlias` set to `true`. If this\
        \ capability is not enabled, the platform will not invoke this endpoint."
      operationId: updateCardAlias
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        description: New card alias
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardAliasRequest'
            example:
              alias: My Business Card
      responses:
        '200':
          description: Card alias updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}/cards/{cardId}/updateReadOnly:
    put:
      tags:
      - Card Lifecycle
      summary: Update card read-only status
      description: 'Sets a card to read-only mode, typically used for direct debit
        card accounts.


        **Business Context**: Used when configuring cards for specific payment methods
        like direct debit where the card should not allow active spending.'
      operationId: updateCardReadOnly
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/cardId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                readOnly:
                  type: boolean
                  description: Whether the card should be read-only
      responses:
        '200':
          description: Card read-only status updated
