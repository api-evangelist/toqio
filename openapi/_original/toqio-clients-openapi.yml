      - Fees
      operationId: getCardFees
      summary: Get card fees
      description: This endpoint is deprecated. You should use <a href="https://docs.toq.io/reference/getcardfees"><u>Card
        Fees</u></a>
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: clientId
        description: Client to filter by
        example: 6188de9f24e2410001b7ea74
        in: path
        required: true
        schema:
          type: string
      - name: currency
        description: Currency to filter by
        example: GBP
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IssueCardFeeDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - clientCredentials: []
      deprecated: true
