openapi: 3.0.0
info:
  description: Endpoints to manage the client (company or individual) and their data
  version: v1.0.0
  title: Clients
  license:
    name: license
servers:
- url: https://api.sandbox.toq.io/iam/api
  description: Simulation environment
- url: https://api.toq.io/iam/api
  description: Production environment
paths:
  /customers/{customerId}/credentials/generateCustomerKey:
    post:
      tags:
      - User credentials
      summary: Generate customer key
      description: Allow to generate a key to encript the credentials data. You must
        keep it in a secure place as we do not have access to it. If you lose it,
        you will need to contact the support team to generate a new one.
      operationId: customerKey
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
      security:
      - clientCredentials: []
  /customers/{customerId}/companies/{clientId}:
    delete:
      tags:
      - Client actions
      summary: Delete company
      description: This endpoint allows deleting a company. Only companies under 'Lead'
        and 'Rejected' status can be rejected
      operationId: deleteClientUsingDELETE
      parameters:
      - name: clientId
        in: path
        description: clientId
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: customerId
        in: path
        description: customerId
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The client was deleted successfully.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      security:
      - clientCredentials: []
