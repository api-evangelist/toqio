openapi: 3.2.0
info:
  title: Toqio Integration Hub Direct debit API
  version: v0
servers:
- url: https://your_connector_url
  description: This is an example url that you could use for testing purposes as this documentation describes the API that you must develop in your connector.
security:
- bearerAuth: []
tags:
- name: Direct Debit
paths:
  /customers/{customerId}/directDebit:
    post:
      tags:
      - Direct Debit
      summary: Apply Direct Debit
      description: ''
      operationId: applyDirectDebit
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitFilter'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkBooleanResponse'
        '400':
          description: INVALID_REQUEST
        '404':
          description: BANK_NOT_FOUND
  /customers/{customerId}/accounts/{accountId}/mandates/{mandateId}:
    get:
      tags:
      - Direct Debit
      summary: Get Mandate Detail
      description: ''
      operationId: getMandateDetail
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: mandateId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkMandateDetailResponse'
        '404':
          description: ACCOUNT_ID_NOT_FOUND
  /accounts/{accountId}/mandates:
    get:
      tags:
      - Direct Debit
      summary: Get Mandates
      description: ''
      operationId: getMandates
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToqioHttpOkMandateResponse'
        '404':
          description: ACCOUNT_ID_NOT_FOUND
components:
  schemas:
    Mandate:
      type: object
      properties:
        mandateId:
          type: string
        merchantName:
          type: string
        merchantAccountNumber:
          type: string
        merchantSortCode:
          type: string
        merchantIban:
          type: string
        mandateStatus:
          type: string
        frequency:
          type: string
          enum:
          - ONCE
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUALLY
          - ANNUALLY
          - WEEKLY
          - EVERY_TWO_WEEKS
          - EVERY_FOUR_WEEKS
        currency:
          type: string
          enum:
          - aud
          - chf
          - cad
          - sek
          - usd
          - nok
          - jpy
          - nzd
          - gold
          - gbp
          - eur
          - czk
          - dkk
          - huf
          - pln
          - ron
          - ils
          - rub
          - bhd
          - sar
          - bgn
          - kes
          - sgd
          - kwd
          - zar
          - cny
          - myr
          - hrk
          - mxn
          - thb
          - try
          - omr
          - ugx
          - hkd
          - php
          - aed
          - inr
          - qar
          - idr
          - points
        amount:
          type: number
          format: double
    DirectDebitFilter:
      type: object
      properties:
        assetType:
          type: string
    ToqioHttpOkMandateResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Mandate'
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
    ToqioHttpOkMandateDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MandateDetail'
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
    MandateDetail:
      type: object
      properties:
        merchantName:
          type: string
        mandateStatus:
          type: string
        amount:
          type: number
          format: double
        frequency:
          type: string
          enum:
          - ONCE
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUALLY
          - ANNUALLY
          - WEEKLY
          - EVERY_TWO_WEEKS
          - EVERY_FOUR_WEEKS
        startDate:
          type: string
          format: date-time
        nextPaymentDate:
          type: string
          format: date-time
    ToqioHttpOkBooleanResponse:
      type: object
      properties:
        data:
          type: boolean
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
