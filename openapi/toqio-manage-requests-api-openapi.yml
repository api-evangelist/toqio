        clientId:
          type: string
        clientName:
          type: string
        invoiceNumber:
          type: string
        invoiceAmount:
          type: number
          format: double
        invoiceCurrency:
          type: string
        invoiceIssueDate:
          type: string
          format: date-time
        invoiceDueDate:
          type: string
          format: date-time
        lineNumber:
          type: integer
          format: int32
        lineErrors:
          type: array
          items:
            $ref: '#/components/schemas/RevenueError'
    InvoiceDataDTO:
