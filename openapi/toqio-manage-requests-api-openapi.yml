          numberOfInstallments:
            type: integer
            format: int32
          installmentFrequency:
            type: string
            enum:
            - MONTHLY
            - WEEKLY
            - BIWEEKLY
    ViewRevenueReduceDTO:
      required:
      - clientId
      - clientName
      - invoiceAmount
      - invoiceCurrency
      - invoiceDueDate
      - invoiceIssueDate
      - invoiceNumber
      type: object
