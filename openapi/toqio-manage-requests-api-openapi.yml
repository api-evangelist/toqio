      type: object
      properties:
        name:
          type: string
        paymentOptions:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/RevenuePayOption'
            - $ref: '#/components/schemas/FullAmountPayOption'
            - $ref: '#/components/schemas/InstallmentsPayOption'
        revenueCollection:
          type: array
          items:
            $ref: '#/components/schemas/ViewRevenueReduceDTO'
    FullAmountPayOption:
      type: object
      allOf:
      - $ref: '#/components/schemas/RevenuePayOption'
