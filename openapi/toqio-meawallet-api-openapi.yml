openapi: 3.2.0
info:
  title: Toqio Integration Hub Mea Wallet API
  version: v0
servers:
- url: https://your_connector_url
  description: This is an example url that you could use for testing purposes as this documentation describes the API that you must develop in your connector.
security:
- bearerAuth: []
tags:
- name: MeaWallet
paths:
  /customers/{customerId}/meaWallet:
    delete:
      tags:
      - MeaWallet
      summary: Delete Mea Wallet
      description: Deprecated
      operationId: deleteMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkVoidResponse'
        '400':
          description: Deletion failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
    get:
      tags:
      - MeaWallet
      summary: Get Mea Wallet API Config
      description: Deprecated
      operationId: getMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkMeaConfigResponse'
        '400':
          description: Invalid input parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeaConfigResponse'
        '500':
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeaConfigResponse'
    put:
      tags:
      - MeaWallet
      summary: Update MEA Wallet API Configuration
      description: Deprecated
      operationId: updateMeaWalletApiConfig
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeaConfigRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ToqioHttpOkMeaConfigResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomException'
components:
  schemas:
    CustomException:
      type: object
      properties:
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
        errorOrigin:
          type: string
    ToqioHttpOkMeaConfigResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MeaConfigResponse'
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
    MeaConfigResponse:
      type: object
      properties:
        apiKeyId:
          type: string
        apiKeyPlain:
          type: string
        totpKey:
          type: string
        totpKeyId:
          type: string
    MeaConfigRequest:
      type: object
      properties:
        apiKeyId:
          type: string
        apiKeyPlain:
          type: string
        totpKey:
          type: string
        totpKeyId:
          type: string
    ToqioHttpOkVoidResponse:
      type: object
      properties:
        data:
          type: object
          writeOnly: true
        code:
          type: string
          example: OK
        errorSeverity:
          type: string
          example: NONE
        message:
          type: string
          example: Ok
        httpStatus:
          type: integer
          format: int32
          example: 200
        requestId:
          type: string
          example: 26b0f78a-79f9-426d-a20b-79841345ae51
        date:
          type: string
          example: '2024-08-01T00:00:00.000Z'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
