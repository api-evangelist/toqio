format: custom-envelope
source: >-
  Derived from the 4xx/5xx responses declared across openapi/*.yml and
  enriched from the documented error references:
  https://platform.toq.io/reference/error-handling (custom/push notification
  error codes) and https://integrate.toq.io/reference/error-management
  (Integration Hub error envelope).
envelopes:
  platform_notifications:
    fields: [code, description, requestId, status]
    notes: requestId is a UUID for troubleshooting and tracing within the Toqio system.
  integration_hub:
    fields: [code, errorSeverity, message, httpStatus, requestId, date, errorOrigin, data]
    notes: >-
      data[] carries field-level errors (field, code, message) whose messages
      are shown to end users in the Toqio frontend; integrations must map BaaS
      provider errors into this envelope (example code:
      REMOTE_COMMUNICATION_ERROR, errorOrigin: bank-connector-hub).
problems:
  - status: 400
    title: Bad Request
    notes: Declared on write operations across the harvested platform specs.
  - status: 401
    title: Unauthorized
    notes: >-
      Missing/invalid Bearer token; also returned by integrations when a
      webhook HMAC signature is absent.
  - status: 403
    title: Forbidden
    notes: >-
      Insufficient permissions; also returned when a webhook HMAC signature is
      present but invalid.
  - status: 404
    title: Not Found
    notes: Declared on nearly every operation for unknown customer/client/resource ids.
  - status: 429
    title: Too Many Requests
    notes: Rate limit exceeded; retry with backoff honoring the Retry-After header (Integration Hub webhook contract).
  - status: 500
    title: Internal Server Error
    notes: >-
      Transient errors carry the Integration Hub envelope (e.g.
      REMOTE_COMMUNICATION_ERROR when a BaaS provider call fails).
